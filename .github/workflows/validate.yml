name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source, assets and public package boundaries
        run: node scripts/check.mjs
      - name: Check registration script syntax
        run: sh -n root/etc/uci-defaults/30_luci-theme-lumen
