name: Build installable packages

on:
  workflow_dispatch:
    inputs:
      reuse_fixture_run:
        description: 'Optional successful fixture run ID; reuse only when package source is unchanged'
        required: false
        type: string
        default: ''
      upload_unsigned_draft:
        description: 'Upload unsigned build packages to an empty v1.0.2 draft (never publish)'
        required: false
        type: boolean
        default: false
      verified_test_run:
        description: 'Successful installation test run ID for draft uploads'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: OpenWrt ${{ matrix.release }} (${{ matrix.format }})
    if: inputs.reuse_fixture_run == '' && !inputs.upload_unsigned_draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '25.12.6'
            format: apk
          - release: '24.10.8'
            format: ipk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: node scripts/check.mjs
      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl ca-certificates gnupg zstd
      - name: Build from authenticated, pinned SDK
        env:
          JOBS: '2'
        run: bash scripts/build-sdk.sh '${{ matrix.release }}'
      - name: Upload packages for local signing and verification
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-openwrt-${{ matrix.release }}-${{ matrix.format }}
          path: dist/openwrt-${{ matrix.release }}/
          if-no-files-found: error
          retention-days: 14
      - name: Upload host verification tools separately
        uses: actions/upload-artifact@v4
        with:
          name: verification-tools-openwrt-${{ matrix.release }}
          path: validation-tools/openwrt-${{ matrix.release }}-host-tools.tar.gz
          if-no-files-found: error
          retention-days: 7

  arm-fixtures:
    name: Prepare isolated installation fixtures
    if: inputs.reuse_fixture_run == '' && !inputs.upload_unsigned_draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-openwrt-25.12.6-apk
          path: fixtures/new-apk
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-openwrt-24.10.8-ipk
          path: fixtures/new-ipk
      - uses: actions/download-artifact@v4
        with:
          name: verification-tools-openwrt-25.12.6
          path: fixture-tools
      - name: Prepare test-signed copies and verify prior release
        run: bash scripts/prepare-arm-fixtures.sh fixtures fixture-tools
      - uses: actions/upload-artifact@v4
        with:
          name: arm-installation-fixtures
          path: fixtures/
          if-no-files-found: error
          retention-days: 3

  arm-install:
    name: ${{ matrix.arch }} / OpenWrt ${{ matrix.release }}
    if: always() && !inputs.upload_unsigned_draft && (inputs.reuse_fixture_run != '' || needs.arm-fixtures.result == 'success')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    needs: arm-fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - {release: '25.12.6', arch: armv8, runner: ubuntu-24.04-arm}
          - {release: '25.12.6', arch: armv7, runner: ubuntu-24.04-arm}
          - {release: '24.10.8', arch: armv8, runner: ubuntu-24.04-arm}
          - {release: '24.10.8', arch: armv7, runner: ubuntu-24.04-arm}
          - {release: '25.12.6', arch: x86_64, runner: ubuntu-24.04}
          - {release: '24.10.8', arch: x86_64, runner: ubuntu-24.04}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enable ARMv7 emulation on the ARM64 runner
        if: matrix.arch == 'armv7'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - uses: actions/download-artifact@v4
        with:
          name: arm-installation-fixtures
          path: fixtures
          run-id: ${{ inputs.reuse_fixture_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm reused package source matches this checkout
        shell: bash
        run: |
          for info in fixtures/new-apk/BUILDINFO.json fixtures/new-ipk/BUILDINFO.json; do
            source_commit="$(node -p "require('./$info').source_commit")"
            [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$source_commit^{commit}"
            git diff --exit-code "$source_commit" HEAD -- Makefile htdocs root po licenses
          done
      - name: Verify installation, upgrade, optional fonts and removal
        run: bash scripts/test-arm.sh '${{ matrix.release }}' '${{ matrix.arch }}' fixtures

  upload-unsigned-draft:
    name: Attach verified unsigned builds to draft only
    if: inputs.upload_unsigned_draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check selected run IDs
        shell: bash
        env:
          SOURCE_RUN: ${{ inputs.reuse_fixture_run }}
          TEST_RUN: ${{ inputs.verified_test_run }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$TEST_RUN" =~ ^[0-9]+$ ]]
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-openwrt-25.12.6-apk
          path: unsigned/apk
          run-id: ${{ inputs.reuse_fixture_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-openwrt-24.10.8-ipk
          path: unsigned/ipk
          run-id: ${{ inputs.reuse_fixture_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify inputs and upload to the empty draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RUN: ${{ inputs.verified_test_run }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN")"
          jq -e '.name == "Build installable packages" and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"' <<< "$run_json" >/dev/null
          test_commit="$(jq -r .head_sha <<< "$run_json")"
          [[ "$test_commit" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$test_commit^{commit}"
          git diff --exit-code "$test_commit" HEAD -- Makefile htdocs root po licenses scripts/test-arm.sh scripts/test-arm-container.sh scripts/prepare-arm-fixtures.sh
          for dir in unsigned/apk unsigned/ipk; do
            (cd "$dir" && sha256sum --strict -c SHA256SUMS.build)
            source_commit="$(node -p "require('./$dir/BUILDINFO.json').source_commit")"
            [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$source_commit^{commit}"
            git diff --exit-code "$source_commit" HEAD -- Makefile htdocs root po licenses
          done
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == true and .tag_name == "v1.0.2" and (.name | contains("待签名"))) | select((.assets | length) == 0) | .id] | if length == 1 then .[0] else empty end')"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          shopt -s nullglob
          files=(unsigned/apk/*.apk unsigned/ipk/*.ipk)
          [[ "${#files[@]}" == 6 ]]
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            [[ "$name" =~ ^[a-zA-Z0-9._-]+$ ]]
            expected="sha256:$(sha256sum "$file" | cut -d ' ' -f1)"
            digest="$(gh api --method POST -H 'Content-Type: application/octet-stream' --input "$file" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" --jq .digest)"
            [[ "$digest" == "$expected" ]]
            echo "Uploaded and checked $name ($digest)"
          done
