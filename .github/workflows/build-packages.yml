name: Build installable packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: OpenWrt ${{ matrix.release }} (${{ matrix.format }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '25.12.6'
            format: apk
          - release: '24.10.8'
            format: ipk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: node scripts/check.mjs
      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl ca-certificates gnupg zstd
      - name: Build from authenticated, pinned SDK
        env:
          JOBS: '2'
        run: bash scripts/build-sdk.sh '${{ matrix.release }}'
      - name: Upload packages for local signing and verification
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-openwrt-${{ matrix.release }}-${{ matrix.format }}
          path: dist/openwrt-${{ matrix.release }}/
          if-no-files-found: error
          retention-days: 14
      - name: Upload host verification tools separately
        uses: actions/upload-artifact@v4
        with:
          name: verification-tools-openwrt-${{ matrix.release }}
          path: validation-tools/openwrt-${{ matrix.release }}-host-tools.tar.gz
          if-no-files-found: error
          retention-days: 7

  arm-fixtures:
    name: Prepare isolated ARM installation fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-openwrt-25.12.6-apk
          path: fixtures/new-apk
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-openwrt-24.10.8-ipk
          path: fixtures/new-ipk
      - uses: actions/download-artifact@v4
        with:
          name: verification-tools-openwrt-25.12.6
          path: fixture-tools
      - name: Prepare test-signed copies and verify prior release
        run: bash scripts/prepare-arm-fixtures.sh fixtures fixture-tools
      - uses: actions/upload-artifact@v4
        with:
          name: arm-installation-fixtures
          path: fixtures/
          if-no-files-found: error
          retention-days: 3

  arm-install:
    name: ARM ${{ matrix.arch }} / OpenWrt ${{ matrix.release }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: arm-fixtures
    strategy:
      fail-fast: false
      matrix:
        release: ['25.12.6', '24.10.8']
        arch: ['armv8', 'armv7']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable ARMv7 emulation on the ARM64 runner
        if: matrix.arch == 'armv7'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - uses: actions/download-artifact@v4
        with:
          name: arm-installation-fixtures
          path: fixtures
      - name: Verify installation, upgrade, optional fonts and removal
        run: bash scripts/test-arm.sh '${{ matrix.release }}' '${{ matrix.arch }}' fixtures
