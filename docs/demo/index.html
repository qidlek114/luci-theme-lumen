<!doctype html>
<html lang="zh-CN" data-mode="dark" data-darkmode="true" data-style="default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lumen theme preview with synthetic data. No router connection.">
  <title>Lumen · 演示数据</title>
  <script>
    const query = new URLSearchParams(location.search);
    const mode = query.get('mode') === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.mode = mode;
    document.documentElement.dataset.darkmode = String(mode === 'dark');
    document.documentElement.dataset.style = query.get('style') === 'claude' ? 'claude' : 'default';
    document.documentElement.lang = query.get('lang') === 'en' ? 'en' : 'zh-CN';
    document.documentElement.dataset.demoView = document.documentElement.lang === 'en' && query.get('view') === 'updates' ? 'updates' : 'dashboard';
  </script>
  <link id="bundled-fonts" rel="stylesheet" href="../../htdocs/luci-static/lumen/fonts.css">

</head>
